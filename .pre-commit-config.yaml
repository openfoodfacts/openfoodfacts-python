repos:
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
  - id: reuse-lint-file

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.0
  hooks:
  # Run the linter.
  - id: ruff-check
  # Run the formatter.
  - id: ruff-format
